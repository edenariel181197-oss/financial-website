services:
  - type: web
    name: eden-finances
    env: node
    buildCommand: npm install && npm run build
    startCommand: node server/index.cjs
    envVars:
      - key: NODE_ENV
        value: production
      # Optional — enables the forward P/E stat. Without it, forwardPE is simply null.
      # Get a free key at https://www.alphavantage.co/support/#api-key and set the value
      # in the Render dashboard (Environment tab) — sync: false keeps it out of git.
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
